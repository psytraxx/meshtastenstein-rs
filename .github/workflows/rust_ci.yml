name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  core:
    name: Core (hardware-agnostic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshtastenstein-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Run fmt
        run: cargo fmt -- --check --color always
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Run build
        run: cargo build --release
      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  nrf52:
    name: Board — Seeed XIAO nRF52840 + Wio-SX1262
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boards/nrf52
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rustfmt, clippy
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Run fmt
        run: cargo fmt -- --check --color always
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Run build
        run: cargo build --release
      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  esp32:
    name: Board — Heltec WiFi LoRa V3 (ESP32-S3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boards/esp32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          # see https://github.com/esp-rs/rust-build/releases for available versions
          ldproxy: false
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Run fmt
        run: cargo fmt -- --check --color always
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Run build
        run: cargo build --release
      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
