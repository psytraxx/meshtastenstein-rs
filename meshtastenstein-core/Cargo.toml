[package]
edition = "2024"
name = "meshtastenstein-core"
rust-version = "1.88"
version = "0.1.0"

[lib]
name = "meshtastenstein_core"
path = "src/lib.rs"

# NOTE: no BLE stack here. The BLE host lives in each board crate so boards
# can pin the version their controller requires — the ESP32's esp-radio
# controller and the nRF52's nrf-sdc need different `bt-hci` majors, and
# `bt-hci` defines the Controller trait bridging host and controller, so one
# shared version can't serve both.
#
# `lora-phy` IS a core dependency, though: `drivers/lora_task_body.rs` is
# generic over its `RadioKind`/`DelayNs` trait bounds (same pattern as
# `sx1262_direct.rs` over embedded-hal traits), so the whole board-agnostic
# TX/RX/CAD event loop lives here once instead of being duplicated per board.

[features]
# Enables an in-crate embassy-time driver backed by std::time::Instant, so
# `cargo test --lib` can link (embassy-time needs exactly one driver impl
# somewhere in the final binary's dependency graph; board crates normally
# supply it, but boards aren't in the graph for `cargo test --lib`). Test-only:
# never enabled by a board build, and the driver module itself needs `std`,
# which is otherwise absent from this `#![no_std]` crate.
test-harness = ["embassy-time/std", "dep:critical-section"]

[dependencies]
log = "0.4.33"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
lora-phy = "3.0.1"

# Protobuf
prost = { version = "0.14.4", default-features = false, features = ["derive"] }

# Crypto (RustCrypto, all no_std)
# Pinned to the versions ccm 0.5 expects — keeping them in lockstep avoids
# pulling two parallel copies of `aes` into the binary.
aes = "0.9.3"
ctr = "0.10"
ccm = { version = "0.6", default-features = false }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
  "zeroize",
] }
zeroize = { version = "1.9.0", default-features = false }

# Concurrency
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-futures = "0.1.2"
heapless = "0.9.3"

# HAL traits — the SX1262 driver and the LED task are generic over these, which
# is what lets both boards share them.
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-storage-async = "0.4"

# Only pulled in as a real dependency by the `test-harness` feature (see
# above) — critical-section, like embassy-time's driver, needs exactly one
# implementation registered in the final binary; board crates provide one via
# their HAL, but no board is in the graph for `cargo test --lib`. Its `std`
# feature registers a std::sync::Mutex-backed impl.
critical-section = { version = "1.1", optional = true, features = ["std"] }

[build-dependencies]
prost-build = "0.14.4"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
