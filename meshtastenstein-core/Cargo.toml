[package]
edition = "2024"
name = "meshtastenstein-core"
rust-version = "1.88"
version = "0.1.0"

[lib]
name = "meshtastenstein_core"
path = "src/lib.rs"

[dependencies]
log = "0.4.33"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"

# NOTE: no BLE stack here. The BLE host lives in each board crate, so boards can
# pin the version their controller requires — the ESP32's esp-radio controller
# and the nRF52's nrf-sdc need different `bt-hci` majors, and `bt-hci` defines
# the Controller trait bridging host and controller, so one shared version can't
# serve both. Core only carries the protocol-level BLE constants below.

critical-section = "1.2.0"
static_cell = "2.1.1"

# Protobuf
prost = { version = "0.14.4", default-features = false, features = ["derive"] }

# Crypto (RustCrypto, all no_std)
# Pinned to the versions ccm 0.5 expects — keeping them in lockstep avoids
# pulling two parallel copies of `aes` into the binary.
aes = "0.8"
ctr = "0.9"
ccm = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
  "zeroize",
] }
zeroize = { version = "1.9.0", default-features = false }

# LoRa
lora-phy = "3.0.1"
embassy-embedded-hal = "0.6.0"

# Concurrency
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-futures = "0.1.2"
heapless = "0.9.3"

# Flash storage
embedded-storage = "0.3"

# HAL traits
embedded-hal = "1.0"
embedded-hal-async = "1.0"
nb = "1.1"

[build-dependencies]
prost-build = "0.14.4"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
