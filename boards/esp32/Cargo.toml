[package]
edition = "2024"
name = "meshtastenstein-esp32"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "meshtastenstein-esp32"
path = "src/main.rs"

[dependencies]
meshtastenstein-core = { path = "../../meshtastenstein-core" }

esp-hal = { version = "1.1.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log = "0.4.33"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-radio = { version = "0.18.0", features = [
  "ble",
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
] }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "5c22e8d47faefeb90f0c16f03ddedf97b82fe282", features = [
  "peripheral",
  "central",
  "gatt",
  "derive",
  "default-packet-pool-mtu-512",
  "security",
  "dev-disable-csprng-seed-requirement",
], default-features = false }

static_cell = "2.1.1"

# NOTE: no protobuf or crypto crates here. Both belong to core, and the board
# reaches proto types through core's re-exports.

# LoRa
lora-phy = "3.0.1"
embassy-embedded-hal = "0.6.0"

# Concurrency
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-futures = "0.1.2"
heapless = "0.9.3"

# Flash storage
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
embedded-storage = "0.3"

nb = "1.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
